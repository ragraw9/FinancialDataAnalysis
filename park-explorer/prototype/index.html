<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park Explorer — Yellowstone (Prototype)</title>
<style>
/* ============ tokens ============ */
:root{
  --blue:#1d3bbd;          /* cobalt sky */
  --water:#2456a8;         /* map water */
  --green:#3f9b45;         /* kelly */
  --forest:#2e6f3e;
  --cream:#f4ecd8;
  --paper:#f7f0dd;
  --verm:#e8502a;
  --ink:#1b1812;

  /* region accents */
  --acc-mammoth:#c96f4a;
  --acc-tower:#2e6f3e;
  --acc-lamar:#d09a2b;
  --acc-canyon:#b5432e;
  --acc-lake:#23538f;
  --acc-oldfaithful:#e8502a;

  --f-display:"Cooper Black","Cooper Std",Recoleta,Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono","Space Mono","Courier New",ui-monospace,monospace;
  --f-cond:Oswald,"Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--f-mono);
  color:var(--ink);
  background:var(--paper);
}
/* paper grain over everything */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background-image:radial-gradient(rgba(27,24,18,.05) 1px,transparent 1.2px);
  background-size:5px 5px;mix-blend-mode:multiply;
}
a{color:inherit;text-decoration:none}
.smallcaps{
  font-family:var(--f-cond);font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;font-stretch:condensed;
}
.display{font-family:var(--f-display);font-weight:900}

/* physical chrome: hard offset shadows, keylines */
.plate{border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
.plate-sm{border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink)}
button{cursor:pointer;font:inherit;color:inherit}
.btn{
  display:inline-block;background:var(--verm);color:var(--cream);
  font-family:var(--f-cond);font-weight:700;text-transform:uppercase;letter-spacing:.12em;
  padding:.7em 1.6em;border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);
  transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.chip{
  display:inline-block;background:var(--cream);border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);padding:.42em .9em;font-size:.78rem;
  transition:transform .08s,box-shadow .08s;
}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.tag{
  display:inline-block;border:1.5px solid var(--ink);padding:.22em .6em;
  font-size:.62rem;background:var(--cream);
}
.tag.veg{background:#e2e8cf}
.tag .season{opacity:.65;font-weight:400;letter-spacing:.06em}

.view{animation:enter .35s ease both}
@keyframes enter{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}

/* ============ landing ============ */
.landing{
  min-height:100vh;background:var(--blue);color:var(--cream);
  position:relative;overflow:hidden;
}
.landing .halftone{
  position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(244,236,216,.06) 1.2px,transparent 1.4px);
  background-size:7px 7px;
}
.landing-inner{position:relative;z-index:2;padding:5vh 5vw;max-width:1400px}
.landing h1{
  font-size:clamp(3.4rem,9vw,6.5rem);line-height:.95;color:var(--cream);
  text-shadow:3px 3px 0 rgba(0,0,0,.25);max-width:7em;
}
.landing .tagline{margin:1.2rem 0 2rem;font-size:.95rem;max-width:30em;line-height:1.5}
.search-row{display:flex;gap:1.1rem;flex-wrap:wrap;align-items:stretch}
.search-box{
  background:var(--cream);color:var(--ink);font-family:var(--f-display);
  font-size:1.6rem;padding:.45em .7em;min-width:min(19em,60vw);
  border:2.5px solid var(--ink);box-shadow:5px 5px 0 rgba(0,0,0,.45);
}
.search-box .caret{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.try-these{margin-top:1.6rem}
.try-these .lbl{font-size:.72rem;opacity:.9;margin-right:.8em}
.try-these .lbl::after{content:" ————";opacity:.5}
.try-row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.7rem}
.try-row .chip{color:var(--ink)}
.stampbadge{
  position:absolute;top:4vh;right:4vw;z-index:3;background:var(--cream);color:var(--ink);
  padding:1rem 1.2rem;text-align:center;transform:rotate(3deg);
  border:2px dashed var(--ink);outline:6px solid var(--cream);
  box-shadow:4px 5px 0 rgba(0,0,0,.35);
}
.stampbadge .big{font-family:var(--f-cond);font-weight:700;letter-spacing:.15em;font-size:1rem}
.stampbadge .small{font-size:.58rem;letter-spacing:.12em;margin-top:.4em}
.infocard{
  position:absolute;right:4vw;bottom:11vh;z-index:3;width:min(24rem,84vw);
  background:var(--cream);color:var(--ink);padding:1.1rem 1.3rem;
  border:2.5px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.4);
}
.infocard h3{font-family:var(--f-cond);font-weight:700;letter-spacing:.06em;font-size:1.05rem}
.infocard .est{color:var(--verm);font-family:var(--f-cond);font-weight:700;letter-spacing:.12em;font-size:.7rem;margin:.25em 0 .6em}
.infocard p{font-size:.78rem;line-height:1.55}
.rubberstamp{
  position:absolute;right:-1.4rem;bottom:-1.6rem;width:6.4rem;height:6.4rem;border-radius:50%;
  border:3px double var(--verm);color:var(--verm);display:flex;align-items:center;justify-content:center;
  text-align:center;font-family:var(--f-cond);font-weight:700;font-size:.6rem;letter-spacing:.12em;
  transform:rotate(-12deg);background:rgba(244,236,216,.6);text-transform:uppercase;
}
.landing-hero{position:absolute;right:0;bottom:0;width:min(62vw,900px);z-index:1;pointer-events:none}
.feature-strip{
  position:absolute;left:0;bottom:0;z-index:3;background:var(--cream);color:var(--ink);
  display:flex;gap:2.2rem;padding:.9rem 5vw .9rem 5vw;flex-wrap:wrap;
  border-top:2.5px solid var(--ink);max-width:100%;
}
.feature-strip span{font-family:var(--f-cond);font-weight:700;letter-spacing:.1em;font-size:.68rem;text-transform:uppercase}
.feature-strip b{margin-right:.45em;font-size:.85rem}

/* ============ shared header ============ */
.topbar{
  display:flex;align-items:center;gap:1.2rem;padding:1rem 4vw;flex-wrap:wrap;
  border-bottom:2.5px solid var(--ink);background:var(--cream);
}
.topbar .lockup{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.01em}
.backstub{
  font-family:var(--f-cond);font-weight:700;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  border:2px dashed var(--ink);padding:.4em .9em;background:var(--paper);
  box-shadow:2px 2px 0 var(--ink);
}
.backstub:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.crumb{font-size:.7rem;opacity:.75;letter-spacing:.08em}

/* ============ park overview ============ */
.park{min-height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.park-map-wrap{flex:1;display:flex;justify-content:center;padding:2vh 3vw}
.park-map-wrap svg{width:min(94vw,880px);height:auto}
.ephemera{
  text-align:center;padding:.8rem;border-top:2px solid var(--ink);
  font-family:var(--f-cond);font-weight:700;font-size:.66rem;letter-spacing:.18em;
  text-transform:uppercase;opacity:.8;
}
.hotspot{cursor:pointer}
.hotspot .zone{transition:opacity .15s}
.hotspot:hover .zone,.hotspot:focus .zone{opacity:.55}
.hotspot .lbl{transition:transform .15s}
.hotspot:hover .lbl,.hotspot:focus .lbl{transform:translateY(-3px)}
.hotspot:focus{outline:none}
.hotspot:focus .lblbox{stroke-width:3.5}
.hotspot .teaser{opacity:0;transition:opacity .15s}
.hotspot:hover .teaser,.hotspot:focus .teaser{opacity:1}

/* ============ region view ============ */
.region-head{border-bottom:2.5px solid var(--ink)}
.region-band{height:.7rem;background:var(--acc)}
.region-title-row{display:flex;align-items:center;gap:1.2rem;padding:.9rem 4vw;background:var(--cream);flex-wrap:wrap}
.region-stamp{
  width:3.4rem;height:3.4rem;border:2px dashed var(--ink);display:flex;align-items:center;justify-content:center;
  background:var(--paper);font-size:1.5rem;transform:rotate(-3deg);box-shadow:2px 2px 0 var(--ink);
}
.region-title-row h2{font-family:var(--f-display);font-size:clamp(1.5rem,3.4vw,2.3rem)}
.region-title-row .teaser-line{font-size:.75rem;opacity:.8;flex-basis:100%;max-width:44em}
.region-body{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(280px,1fr);gap:1.6rem;padding:1.6rem 4vw;align-items:start}
@media(max-width:900px){.region-body{grid-template-columns:1fr}}
.region-map-panel{position:relative;background:var(--cream);padding:.8rem;border:2.5px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.region-map-panel svg{width:100%;height:auto;display:block}
.layer-toggle{
  position:absolute;top:1.1rem;right:1.1rem;display:flex;z-index:5;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);background:var(--paper);
}
.layer-toggle button{
  font-family:var(--f-cond);font-weight:700;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  padding:.5em .9em;background:var(--paper);border:none;border-right:2px solid var(--ink);
}
.layer-toggle button:last-child{border-right:none}
.layer-toggle button.on{background:var(--ink);color:var(--cream)}
.side-panel{display:flex;flex-direction:column;gap:1rem}
.panel-h{font-family:var(--f-cond);font-weight:700;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-top:.4rem}
.panel-h::after{content:" ————";opacity:.4}
.trailcard{
  position:relative;background:var(--cream);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:.8rem 1rem .8rem 1.9rem;display:block;transition:transform .1s,box-shadow .1s;
}
.trailcard:hover,.trailcard.hl{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.trailcard::before{ /* punched hole */
  content:"";position:absolute;left:.6rem;top:50%;width:.55rem;height:.55rem;margin-top:-.32rem;
  border-radius:50%;border:2px solid var(--ink);background:var(--paper);
}
.trailcard h4{font-family:var(--f-cond);font-weight:700;letter-spacing:.05em;font-size:.95rem;text-transform:uppercase}
.trailcard .stats{display:flex;gap:1.1em;font-size:.68rem;margin-top:.35em;flex-wrap:wrap}
.trailcard .stats b{font-family:var(--f-cond);letter-spacing:.08em}
.diff{color:var(--acc,#b5432e);letter-spacing:.15em}
.tagrow{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.2rem}

/* map markers */
.trailpath{fill:none;stroke:var(--acc);stroke-width:3.5;stroke-dasharray:7 6;stroke-linecap:round}
.marker{cursor:pointer}
.marker circle.pin,.marker rect.pin{transition:transform .1s}
.marker:hover circle.pin,.marker.hl circle.pin,.marker:hover rect.pin,.marker.hl rect.pin{transform:scale(1.25);transform-origin:center;transform-box:fill-box}
.contours path{fill:none;stroke:#8a6f4d;stroke-width:1.4;opacity:0}
.rsvg.layer-topo .contours path{opacity:.75}
.rsvg.layer-topo .terrain{opacity:.22}
.rsvg.layer-topo .rmroad{opacity:.35}
.rsvg.layer-trails .terrain{opacity:.18}
.rsvg.layer-trails .rmroad{opacity:.3}
.rsvg.layer-trails .trailpath{stroke-width:5.5;stroke-dasharray:none}
.rsvg .terrain,.rsvg .rmroad,.rsvg .trailpath,.rsvg .contours path{transition:opacity .2s,stroke-width .2s}

/* ============ detail sheet ============ */
.sheet-scrim{position:fixed;inset:0;background:rgba(27,24,18,.5);z-index:20;animation:fadein .25s both}
@keyframes fadein{from{opacity:0}}
.sheet{
  position:fixed;z-index:21;inset:0;margin:auto;width:min(46rem,94vw);height:fit-content;max-height:92vh;overflow:auto;
  background:var(--cream);border:3px solid var(--ink);box-shadow:9px 9px 0 var(--ink);
  animation:sheetup .3s ease both;
}
@keyframes sheetup{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.sheet .band{height:.8rem;background:var(--acc)}
.sheet-inner{padding:1.4rem 2rem 2.2rem;position:relative}
.sheet .close{
  position:absolute;top:1rem;right:1rem;background:var(--paper);border:2px solid var(--ink);
  box-shadow:2px 2px 0 var(--ink);font-family:var(--f-cond);font-weight:700;font-size:.62rem;
  letter-spacing:.12em;padding:.4em .8em;text-transform:uppercase;
}
.sheet .typelbl{font-family:var(--f-cond);font-weight:700;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:.3em}
.sheet h2{font-family:var(--f-display);font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.05;max-width:14em}
.statrow{
  display:flex;gap:0;margin:1.2rem 0;border:2px solid var(--ink);background:var(--paper);
  box-shadow:3px 3px 0 var(--ink);flex-wrap:wrap;
}
.stat{flex:1;min-width:7.5rem;padding:.7rem .9rem;border-right:2px dashed var(--ink)}
.stat:last-child{border-right:none}
.stat .l{font-family:var(--f-cond);font-weight:700;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
.stat .v{font-size:.86rem;margin-top:.25em}
.stat .v.diff{font-size:.8rem}
.sec-h{font-family:var(--f-cond);font-weight:700;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin:1.4rem 0 .6rem}
.sec-h::after{content:" ————";opacity:.4}
.elev-wrap{border:2px solid var(--ink);background:var(--paper);padding:.7rem;box-shadow:3px 3px 0 var(--ink)}
.elev-wrap svg{width:100%;height:auto;display:block}
.seerow{display:flex;gap:.6rem;flex-wrap:wrap}
.see{
  border:2px dashed var(--ink);background:var(--paper);padding:.45em .8em;
  font-family:var(--f-cond);font-weight:700;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
}
.season-line{font-family:var(--f-cond);font-weight:700;letter-spacing:.16em;font-size:.78rem;color:var(--acc)}
.tip{
  position:relative;border:2.5px double var(--verm);color:#7a2c15;background:rgba(232,80,42,.06);
  padding:.9rem 1.1rem .9rem 1.1rem;margin-top:.8rem;font-size:.78rem;line-height:1.55;transform:rotate(-.5deg);
}
.tip + .tip{transform:rotate(.6deg)}
.tip .tiplbl{
  position:absolute;top:-.85em;left:.9rem;background:var(--cream);padding:0 .5em;color:var(--verm);
  font-family:var(--f-cond);font-weight:700;font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;
}
.sheet .maplink{margin-top:1.6rem;display:inline-block}

/* toast stamp */
#toast{
  position:fixed;left:50%;top:18%;z-index:50;transform:translateX(-50%) rotate(-8deg) scale(.8);
  width:11rem;height:11rem;border-radius:50%;border:4px double var(--verm);color:var(--verm);
  display:none;align-items:center;justify-content:center;text-align:center;pointer-events:none;
  font-family:var(--f-cond);font-weight:700;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;
  background:rgba(244,236,216,.85);padding:1rem;
}
#toast.show{display:flex;animation:stampin 1.6s ease both}
@keyframes stampin{
  0%{opacity:0;transform:translateX(-50%) rotate(-8deg) scale(1.6)}
  12%{opacity:1;transform:translateX(-50%) rotate(-8deg) scale(1)}
  80%{opacity:1}100%{opacity:0}
}
</style>
</head>

<div id="app"></div>
<div id="toast" role="status"></div>

const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function seededWobble(cx,cy,r,seed){
  const pts=[],n=14;
  for(let i=0;i<n;i++){
    const a=i/n*Math.PI*2;
    const w=1+0.16*Math.sin(seed*3.7+i*2.3)+0.1*Math.cos(seed*1.9+i*4.1);
    pts.push([cx+Math.cos(a)*r*w, cy+Math.sin(a)*r*w*0.82]);
  }
  let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for(let i=1;i<=n;i++){
    const p=pts[i%n], prev=pts[i-1];
    d+=` Q${prev[0].toFixed(1)},${prev[1].toFixed(1)} ${((prev[0]+p[0])/2).toFixed(1)},${((prev[1]+p[1])/2).toFixed(1)}`;
  }
  return d+" Z";
}
function contourGroup(peaks){
  let out="";
  peaks.forEach(([cx,cy,r],pi)=>{
    for(let i=1;i<=4;i++) out+=`<path d="${seededWobble(cx,cy,r*i/4.4,pi*7+i)}"/>`;
  });
  return `<g class="contours">${out}</g>`;
}

  <text x="530" y="588" text-anchor="middle" font-family="var(--f-cond)" font-weight="700" font-size="12" letter-spacing="2.5" fill="var(--cream)">YELLOWSTONE LAKE</text>
</svg>`;
}
function renderPark(){
  document.title="Yellowstone — Park Explorer";
  app.innerHTML=`
<div class="view park">
  <div class="topbar">
    <a class="backstub" href="#/">◀ Search</a>
    <span class="lockup">Park Explorer</span>
    <span class="crumb smallcaps">/ Yellowstone / Park Map</span>
    <span class="smallcaps" style="margin-left:auto;font-size:.62rem;opacity:.6">Tap a region</span>
  </div>
  <div class="park-map-wrap">${parkSVG()}</div>
  <div class="ephemera">Est. March 1, 1872 · 2,221,766 acres · World's first national park</div>
</div>`;
}

/* =====================================================================
   Level 2 — region view (+ Level 3 sheet)
   ===================================================================== */
const FEATURE_FILL={forest:"#cfe0b8",meadow:"#e8d9a8",canyon:"#d8a58c",water:"var(--water)",thermal:"#f3c9a4"};
function regionSVG(r){
  const layer=layerState[r.id]||"base";
  const feats=r.features.map(f=>{
    if(f.c) return `<g class="terrain">${f.c.map(([x,y,rad])=>`<circle cx="${x}" cy="${y}" r="${rad}" fill="${FEATURE_FILL[f.k]}" stroke="var(--ink)" stroke-width="2"/>`).join("")}</g>`;
    if(f.k==="river") return `<path class="terrain" d="${f.d}" fill="none" stroke="var(--water)" stroke-width="4" opacity=".8"/>`;
    if(f.k==="road") return `<g class="rmroad"><path d="${f.d}" fill="none" stroke="var(--ink)" stroke-width="4.5" stroke-linecap="round"/><path d="${f.d}" fill="none" stroke="var(--cream)" stroke-width="1.6" stroke-dasharray="7 6"/></g>`;
    return `<path class="terrain" d="${f.d}" fill="${FEATURE_FILL[f.k]}" stroke="var(--ink)" stroke-width="2.5" opacity=".85"/>`;
  }).join("");
  const trails=r.items.map((it,i)=>{
    const marker = it.t==="trail"
      ? `<circle class="pin" cx="${it.pin[0]}" cy="${it.pin[1]}" r="12" fill="var(--cream)" stroke="var(--ink)" stroke-width="2.5"/>
         <text x="${it.pin[0]}" y="${it.pin[1]+4.5}" text-anchor="middle" font-family="var(--f-cond)" font-weight="700" font-size="12">${i+1}</text>`
      : `<rect class="pin" x="${it.pin[0]-9}" y="${it.pin[1]-9}" width="18" height="18" fill="var(--cream)" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2.5" transform="rotate(45 ${it.pin[0]} ${it.pin[1]})"/>
         <text x="${it.pin[0]}" y="${it.pin[1]+4}" text-anchor="middle" font-size="10">★</text>`;
    return `${it.t==="trail"&&it.d?`<path class="trailpath" d="${it.d}"/>`:""}
      <a class="marker" data-id="${it.id}" href="#/region/${r.id}/${it.id}" aria-label="${esc(it.name)}"><title>${esc(it.name)}</title>${marker}</a>`;
  }).join("");
  return `<svg class="rsvg layer-${layer}" viewBox="0 0 600 480" style="--acc:${r.accent}" aria-label="${esc(r.name)} map">
    <rect x="0" y="0" width="600" height="480" fill="#efe6cb" stroke="var(--ink)" stroke-width="3"/>
    ${feats}
    ${contourGroup(r.peaks)}
    ${trails}
  </svg>`;
}
function renderRegion(rid,itemId){
  const r=byId[rid]; if(!r){location.hash="#/park";return}
  document.title=`${r.name} — Park Explorer`;
  const trails=r.items.filter(i=>i.t==="trail"), spots=r.items.filter(i=>i.t==="spot");
  const card=(it,i)=>`
    <a class="trailcard" data-id="${it.id}" href="#/region/${r.id}/${it.id}" style="--acc:${r.accent}">
      <h4>${it.t==="trail"?`${i+1}. `:"★ "}${esc(it.name)}</h4>
      ${it.t==="trail"?`<div class="stats">
        <span><b>DIST</b> ${it.dist}</span>
        <span class="diff"><b>${DIFF_GLYPH[it.diff]}</b> ${it.diff.toUpperCase()}</span>
        <span><b>TIME</b> ${it.time}</span>
      </div>`:`<div class="stats"><span>${esc(it.see.join(" · "))}</span></div>`}
    </a>`;
  app.innerHTML=`
<div class="view" style="--acc:${r.accent}">
  <div class="region-head">
    <div class="region-band"></div>
    <div class="region-title-row">
      <a class="backstub" href="#/park">◀ Park Map</a>
      <div class="region-stamp">${r.icon}</div>
      <h2>${esc(r.name)}</h2>
      <span class="teaser-line">${esc(r.teaser)}</span>
    </div>
  </div>
  <div class="region-body">
    <div class="region-map-panel">
      <div class="layer-toggle" role="group" aria-label="Map layer">
        ${["base","topo","trails"].map(l=>`<button data-layer="${l}" class="${(layerState[r.id]||'base')===l?'on':''}">${l}</button>`).join("")}
      </div>
      ${regionSVG(r)}
    </div>
    <div class="side-panel">
      <div class="panel-h">Trails</div>
      ${trails.map(card).join("")}
      <div class="panel-h">Top Spots</div>
      ${spots.map(card).join("")}
      <div class="panel-h">Likely Wildlife</div>
      <div class="tagrow">${r.wildlife.map(w=>`<span class="tag smallcaps">${esc(w.n)}${w.s?` <span class="season">· ${w.s}</span>`:""}</span>`).join("")}</div>
      <div class="panel-h">Biome Character</div>
      <div class="tagrow">${r.vegetation.map(v=>`<span class="tag veg smallcaps">${esc(v)}</span>`).join("")}</div>
    </div>
  </div>
</div>`;
  /* layer toggle */
  app.querySelectorAll("[data-layer]").forEach(b=>b.addEventListener("click",()=>{
    layerState[r.id]=b.dataset.layer;
    const svg=app.querySelector(".rsvg");
    svg.classList.remove("layer-base","layer-topo","layer-trails");
    svg.classList.add("layer-"+b.dataset.layer);
    app.querySelectorAll("[data-layer]").forEach(x=>x.classList.toggle("on",x===b));
  }));
  /* card ⇄ marker highlight sync */
  const sync=(id,on)=>app.querySelectorAll(`[data-id="${id}"]`).forEach(el=>el.classList.toggle("hl",on));
  app.querySelectorAll("[data-id]").forEach(el=>{
    el.addEventListener("mouseenter",()=>sync(el.dataset.id,true));
    el.addEventListener("mouseleave",()=>sync(el.dataset.id,false));
  });
  if(itemId) renderSheet(r,itemId);
}

/* =====================================================================
   Level 3 — detail sheet
   ===================================================================== */
function elevSVG(pts){
  const w=520,h=130,pad=8;
  const min=Math.min(...pts),max=Math.max(...pts),span=Math.max(max-min,40);
  const X=i=>pad+i*(w-2*pad)/(pts.length-1);
  const Y=v=>h-pad-((v-min)/span)*(h-2*pad-18);
  const line=pts.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const gain=pts.reduce((g,v,i)=>i&&v>pts[i-1]?g+v-pts[i-1]:g,0);
  return `<svg viewBox="0 0 ${w} ${h+22}" aria-label="Elevation profile">
    <defs><pattern id="ht" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="var(--acc)" opacity=".35"/></pattern></defs>
    <path d="${line} L${X(pts.length-1)},${h-2} L${X(0)},${h-2} Z" fill="url(#ht)"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>
    <text x="${pad}" y="${h+14}" font-family="var(--f-cond)" font-weight="700" font-size="11" letter-spacing="1.5">MIN ${min.toLocaleString()} FT</text>
    <text x="${w/2}" y="${h+14}" text-anchor="middle" font-family="var(--f-cond)" font-weight="700" font-size="11" letter-spacing="1.5" fill="var(--acc)">+${Math.round(gain).toLocaleString()} FT GAIN</text>
    <text x="${w-pad}" y="${h+14}" text-anchor="end" font-family="var(--f-cond)" font-weight="700" font-size="11" letter-spacing="1.5">MAX ${max.toLocaleString()} FT</text>
  </svg>`;
}
function renderSheet(r,itemId){
  const it=r.items.find(x=>x.id===itemId); if(!it) return;
  document.title=`${it.name} — ${r.name}`;
  const sheet=document.createElement("div");
  sheet.innerHTML=`
  <div class="sheet-scrim"></div>
  <div class="sheet" style="--acc:${r.accent}" role="dialog" aria-label="${esc(it.name)}">
    <div class="band"></div>
    <div class="sheet-inner">
      <a class="close" href="#/region/${r.id}">✕ Close</a>
      <div class="typelbl">${r.icon} ${esc(r.name)} · ${it.t==="trail"?"Trail":"Viewpoint"}</div>
      <h2>${esc(it.name)}</h2>
      <div class="statrow">
        <div class="stat"><div class="l">Distance</div><div class="v">${it.dist}</div></div>
        <div class="stat"><div class="l">Difficulty</div><div class="v diff" style="color:${r.accent}">${DIFF_GLYPH[it.diff]} ${it.diff.toUpperCase()}</div></div>
        <div class="stat"><div class="l">Est. Time</div><div class="v">${it.time}</div></div>
        <div class="stat"><div class="l">Trailhead</div><div class="v">${esc(it.head)}</div></div>
      </div>
      ${it.elev?`<div class="sec-h">Elevation Profile</div><div class="elev-wrap">${elevSVG(it.elev)}</div>`:""}
      <div class="sec-h">What You'll See</div>
      <div class="seerow">${it.see.map(s=>`<span class="see">${esc(s)}</span>`).join("")}</div>
      <div class="sec-h">Best Season</div>
      <div class="season-line">BEST: ${esc(it.season)}</div>
      ${it.tips.map((t,i)=>`<div class="tip"><span class="tiplbl">${i?"Field Note":"Ranger's Note"}</span>${esc(t)}</div>`).join("")}
      <a class="maplink backstub" href="#/region/${r.id}">◀ Back to ${esc(r.name)} map</a>
    </div>
  </div>`;
  sheet.querySelector(".sheet-scrim").addEventListener("click",()=>location.hash=`#/region/${r.id}`);
  app.appendChild(sheet);
}

/* =====================================================================
   router — every level is URL-addressable; browser back = in-app back
   ===================================================================== */
function route(){
  const h=location.hash.replace(/^#\/?/,"");
  const [seg,rid,item]=h.split("/");
  window.scrollTo(0,0);
  if(seg==="park") renderPark();
  else if(seg==="region"&&rid) renderRegion(rid,item);
  else renderLanding();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
